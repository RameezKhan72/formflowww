name: formflow
description: FormFlow - AI-based real-time exercise form correction and fitness coaching app.
publish_to: 'none'
version: 1.2.0+3

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  shared_preferences: ^2.3.0
  camera: '>=0.11.0 <1.0.0'
  google_mlkit_pose_detection: '>=0.12.0 <1.0.0'
  flutter_tts: '>=4.0.0 <5.0.0'
  wakelock_plus: '>=1.2.0 <2.0.0'
  share_plus: ^11.0.0
  path_drawing: ^1.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/anatomy3d/
    - assets/exercise_anim/
    - assets/thumbs/
